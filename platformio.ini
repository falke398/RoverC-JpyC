[platformio]
default_envs = controller, rover
core_dir = .pio-core

[env]
test_framework = unity

[device]
platform = espressif32@6.10.0
board = m5stick-c
framework = arduino
lib_deps =
	m5stack/M5Unified@0.2.7
	m5stack/M5GFX@0.2.36
monitor_speed = 115200
build_flags =
	-std=gnu++17
	-I include
build_unflags = -std=gnu++11

[env:controller]
extends = device
build_src_filter = +<controller/>

[env:rover]
extends = device
build_src_filter = +<rover/>

[env:bootcheck]
extends = device
lib_deps =
build_src_filter = +<bootcheck/>

[env:displaycheck]
extends = device
build_flags =
	${device.build_flags}
	-DBOOTCHECK_M5
build_src_filter = +<bootcheck/>

[env:native]
platform = native@1.2.1
extra_scripts = pre:scripts/native_toolchain.py
build_flags = -std=c++14 -Wall -Wextra -Werror
lib_compat_mode = off
lib_ignore = Hardware, RadioLink
test_build_src = no